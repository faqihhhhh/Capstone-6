services:
  documentmanagement.api:
    build:
      context: .
      dockerfile: ./DocumentManagement.API/Dockerfile
    ports:
      - "8080:80"
      - "8081:443"
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
    networks:
      - app_network
    restart: on-failure
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: "IDS3511p8"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    networks:
      - app_network
    restart: on-failure
networks:
  app_network:
volumes:
  sqlserverdata: